<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>引擎调试页 · PDF → JPG</title>
  </head>
  <body>
    <main class="page">
      <h1>引擎调试页</h1>
      <p class="hint">
        阶段 1 的临时页面，只在 <code>npm run dev</code> 下可用，不进生产构建。
        测试文件在 <code>fixtures/generated/</code>（先跑 <code>npm run fixtures</code>）。
      </p>

      <div id="support-panel" hidden></div>

      <section class="controls">
        <label>PDF 文件 <input type="file" id="file" accept="application/pdf,.pdf" /></label>
        <label>或用生成的样本
          <select id="fixture">
            <option value="">（不使用）</option>
            <option value="single-page.pdf">single-page.pdf</option>
            <option value="fifty-pages.pdf">fifty-pages.pdf</option>
            <option value="landscape.pdf">landscape.pdf</option>
            <option value="a0-huge.pdf">a0-huge.pdf</option>
            <option value="transparent-background.pdf">transparent-background.pdf</option>
          </select>
        </label>
        <label>DPI <input type="number" id="dpi" value="150" min="1" max="600" step="1" /></label>
        <label>质量 <input type="number" id="quality" value="0.85" min="0.1" max="1" step="0.05" /></label>
        <label>页码范围 <input type="text" id="range" placeholder="留空 = 全部，例 1-3,5" /></label>
        <label>密码 <input type="password" id="password" placeholder="加密 PDF 才需要" /></label>
        <div class="buttons">
          <button id="run" type="button">开始转换</button>
          <button id="cancel" type="button" disabled>取消</button>
        </div>
      </section>

      <p id="status" class="status">等待选择文件。</p>
      <div id="results" class="results"></div>
    </main>

    <script type="module" src="/src/debug.js"></script>
  </body>
</html>
